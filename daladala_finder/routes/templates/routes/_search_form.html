{% load i18n %}<form class="search-form" method="get" action="{% url 'routes:search' %}" novalidate>
  {% if form.non_field_errors %}
    <div class="form-error mb-3" role="alert">{{ form.non_field_errors.0 }}</div>
  {% endif %}
  <div class="search-fields">
    <div class="field">
      <label for="id_start">{% translate "From" %}</label>
      <div class="input-icon">
        <span class="dot dot-start" aria-hidden="true"></span>
        <input id="id_start" name="start" list="stop-names" class="form-control form-control-lg"
               placeholder="{% translate "e.g." %} DIT" value="{{ form.start.value|default:'' }}" autocomplete="off" required>
      </div>
      {% for error in form.start.errors %}<div class="form-error">{{ error }}</div>{% endfor %}
    </div>

    <button type="button" class="swap-btn" data-swap aria-label="{% translate "Swap From and To" %}" title="{% translate "Swap From and To" %}">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="field">
      <label for="id_destination">{% translate "To" %}</label>
      <div class="input-icon">
        <span class="dot dot-end" aria-hidden="true"></span>
        <input id="id_destination" name="destination" list="stop-names" class="form-control form-control-lg"
               placeholder="{% translate "e.g." %} Mbagala Rangi Tatu" value="{{ form.destination.value|default:'' }}" autocomplete="off" required>
      </div>
      {% for error in form.destination.errors %}<div class="form-error">{{ error }}</div>{% endfor %}
    </div>
  </div>
  <datalist id="stop-names">
    {% for stop in all_stops %}<option value="{{ stop.name }}">{% if stop.alternative_name %}{{ stop.alternative_name }}{% endif %}</option>{% endfor %}
  </datalist>
  <button type="submit" class="btn btn-go btn-lg w-100">{% translate "Find daladala" %}</button>
</form>
